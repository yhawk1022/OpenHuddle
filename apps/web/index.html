<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OpenHuddle — 有事，和你的 AI 一起聊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var stored;
        try {
          stored = localStorage.getItem("oh_theme");
        } catch (_err) {
          // 存储不可用时仍按设备时间应用首屏主题。
        }
        // 与 theme-store.ts 的运行时规则一致，在应用挂载前解析当前配色。
        var hour = new Date().getHours();
        var isDark = stored === "dark" || (stored !== "light" && (hour < 7 || hour >= 18));
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body class="selection:bg-[#181B22]/12 dark:selection:bg-white/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
